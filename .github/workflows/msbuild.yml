name: MSBuild

on:
  push:
    branches: [ "v2", "yousj-plus" ]
  pull_request:
    branches: [ "v2" ]
  workflow_dispatch:
    

env:
  SOLUTION_FILE_PATH: .
  BUILD_CONFIGURATION: Release
  VCPKG_DEFAULT_TRIPLET: x86-windows
  VCPKG_INSTALLED_DIR: ./vcpkg_installed/
  # runner 的 CMake 已是 4.x，移除了对 cmake_minimum_required < 3.5 的兼容，
  # 固定版 vcpkg 的老端口（brotli/fltk 等）配置阶段会直接报错；
  # 用官方给的策略变量让这些老端口按 3.5 策略继续配置。
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  # vcpkg 构建端口时默认不透传任意环境变量，必须用 VCPKG_KEEP_ENV_VARS
  # 显式保留，上面的策略变量才能进到各端口的 CMake 配置进程里（已实测验证）。
  VCPKG_KEEP_ENV_VARS: "CMAKE_POLICY_VERSION_MINIMUM"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions: write-all
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.0.2
      
    - name: Setup vcpkg
      # 不再用 lukka/run-vcpkg@v10：它在当前 runner 上检出固定提交时报
      # pathspec 错误后静默放行，实际跑的是 runner 预装的 C:\vcpkg（版本漂移），
      # 依赖装不进项目预期的 vcpkg_installed 目录，编译时找不到 neargye/semver.hpp。
      # 改为自己克隆并 bootstrap 固定提交，并显式钉住 VCPKG_ROOT 与 PATH 优先级。
      run: |
        git clone https://github.com/microsoft/vcpkg.git vcpkg
        git -C vcpkg checkout 69efe9cc2df0015f0bb2d37d55acde4a75c9a25b
        .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
        echo "VCPKG_ROOT=${{ github.workspace }}\vcpkg" >> $env:GITHUB_ENV
        echo "${{ github.workspace }}\vcpkg" >> $env:GITHUB_PATH
    - name: Seed vcpkg tool downloads
      # 固定版 vcpkg 要从 7-zip.org 下载 7z2107-extra.7z，该地址现已 404。
      # 从 7-Zip 官方 GitHub 发布的同一文件预填 vcpkg 的 downloads 缓存
      # （vcpkg 自行校验哈希，命中就跳过下载）。
      run: |
        New-Item -ItemType Directory -Force vcpkg\downloads | Out-Null
        curl.exe -L -o vcpkg\downloads\7z2107-extra.7z https://github.com/ip7z/7zip/releases/download/21.07/7z2107-extra.7z
        # 固定版 vcpkg 的 MSYS2 旧包已从官方源下架；下面从 web.archive.org 存档
        # 逐个预填 downloads 缓存并按固定版记录的 SHA512 当场校验，对不上就删掉
        # 并警告（回退官方源）。不用数组：PowerShell 的 @() 会把嵌套数组展平，
        # 上一版就因此把文件名/地址/哈希当成单个字符串逐个迭代，全军覆没。
        curl.exe -sL --retry 3 -o "vcpkg\downloads\autoconf-2.71-3-any.pkg.tar.zst" "https://web.archive.org/web/20220121045421id_/https://repo.msys2.org/msys/x86_64/autoconf-2.71-3-any.pkg.tar.zst"
        if ((Test-Path "vcpkg\downloads\autoconf-2.71-3-any.pkg.tar.zst") -and ((Get-FileHash "vcpkg\downloads\autoconf-2.71-3-any.pkg.tar.zst" -Algorithm SHA512).Hash -ieq "f639deac9b2191c2096584cf374103bbb1e9d2476dd0ebec94b1e80da59be25b88e362ac5280487a89f0bb0ed57f99b66e314f36b7de9cda03c0974806a3a4e2")) { Write-Host "seeded OK: autoconf-2.71-3-any.pkg.tar.zst" } else { Write-Host "::warning::seed failed, falling back to origin: autoconf-2.71-3-any.pkg.tar.zst"; Remove-Item "vcpkg\downloads\autoconf-2.71-3-any.pkg.tar.zst" -ErrorAction SilentlyContinue }
        curl.exe -sL --retry 3 -o "vcpkg\downloads\automake-wrapper-11-4-any.pkg.tar.zst" "https://web.archive.org/web/20220524221611id_/https://repo.msys2.org/msys/x86_64/automake-wrapper-11-4-any.pkg.tar.zst"
        if ((Test-Path "vcpkg\downloads\automake-wrapper-11-4-any.pkg.tar.zst") -and ((Get-FileHash "vcpkg\downloads\automake-wrapper-11-4-any.pkg.tar.zst" -Algorithm SHA512).Hash -ieq "175940ebccb490c25d2c431dd025f24a7d0c930a7ee8cb81a44a4989c1d07f4b5a8134e1d05a7a1b206f8e19a2308ee198b1295e31b2e139f5d9c1c077252c94")) { Write-Host "seeded OK: automake-wrapper-11-4-any.pkg.tar.zst" } else { Write-Host "::warning::seed failed, falling back to origin: automake-wrapper-11-4-any.pkg.tar.zst"; Remove-Item "vcpkg\downloads\automake-wrapper-11-4-any.pkg.tar.zst" -ErrorAction SilentlyContinue }
