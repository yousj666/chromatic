name: MSBuild

on:
  push:
    branches: [ "v2", "yousj-plus" ]
  pull_request:
    branches: [ "v2" ]
  workflow_dispatch:
    

env:
  SOLUTION_FILE_PATH: .
  BUILD_CONFIGURATION: Release
  VCPKG_DEFAULT_TRIPLET: x86-windows
  VCPKG_INSTALLED_DIR: ./vcpkg_installed/

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions: write-all
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.0.2
      
    - name: Setup vcpkg
      # 不再用 lukka/run-vcpkg@v10：它在当前 runner 上检出固定提交时报
      # pathspec 错误后静默放行，实际跑的是 runner 预装的 C:\vcpkg（版本漂移），
      # 依赖装不进项目预期的 vcpkg_installed 目录，编译时找不到 neargye/semver.hpp。
      # 改为自己克隆并 bootstrap 固定提交，并显式钉住 VCPKG_ROOT 与 PATH 优先级。
      run: |
        git clone https://github.com/microsoft/vcpkg.git vcpkg
        git -C vcpkg checkout 69efe9cc2df0015f0bb2d37d55acde4a75c9a25b
        .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
        echo "VCPKG_ROOT=${{ github.workspace }}\vcpkg" >> $env:GITHUB_ENV
        echo "${{ github.workspace }}\vcpkg" >> $env:GITHUB_PATH
    - name: Seed vcpkg tool downloads
      # 固定版 vcpkg 要从 7-zip.org 下载 7z2107-extra.7z，该地址现已 404。
      # 从 7-Zip 官方 GitHub 发布的同一文件预填 vcpkg 的 downloads 缓存
      # （vcpkg 自行校验哈希，命中就跳过下载）。
      run: |
        New-Item -ItemType Directory -Force vcpkg\downloads | Out-Null
        curl.exe -L -o vcpkg\downloads\7z2107-extra.7z https://github.com/ip7z/7zip/releases/download/21.07/7z2107-extra.7z

    - name: Install vcpkg dependencies
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: ./InstallDependencies.bat
    - name: Install NPM packages
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: cd ./src/js-framework ; npm i

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild .\BetterNCMII.sln -p:Platform="All" -p:Configuration=Release

    - uses: "marvinpinto/action-automatic-releases@latest"
      name: Upload to Github Release
      if: github.event_name != 'pull_request'
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: "dev-nightly"
        prerelease: true
        title: "Latest Test Release"
        files: |
          ${{ github.workspace }}/x64/Release/BetterNCMII.dll
          ${{ github.workspace }}/Release_86/BetterNCMII86.dll

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BetterNCMII
        path: |
          ${{ github.workspace }}/x64/Release/BetterNCMII.dll
          ${{ github.workspace }}/Release_86/BetterNCMII86.dll
        

